<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management System</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    .hidden { display: none !important; }

    /* Layout Components */
    .container { max-width: 1000px; margin: auto; width: 100%; padding: 2rem 1rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; }
    
    /* Forms & Inputs */
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem; }
    input, select { width: 100%; padding: 0.65rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
    
    /* Buttons */
    button { background: var(--primary); color: #fff; border: none; padding: 0.65rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { opacity: 0.9; }
    button.btn-secondary { background: var(--border); color: var(--text); }
    button.btn-danger { background: var(--danger); }
    
    /* Data Table */
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: var(--card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #162032; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; }

    /* Modal Overlay */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 100; }
    .modal-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; width: 100%; max-width: 400px; padding: 1.5rem; }
  </style>
</head>
<body>

  <!-- 1. LOGIN VIEW -->
  <div id="loginView" class="container" style="max-width: 400px;">
    <div class="card">
      <h2 style="margin-bottom: 1rem; text-align: center;">Sign In</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required />
        </div>
        <button type="submit" style="width: 100%;">Login</button>
      </form>
    </div>
  </div>

  <!-- 2. MAIN DASHBOARD VIEW -->
  <div id="dashboardView" class="container hidden">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <div>
        <h1>Dashboard</h1>
        <small id="userSessionInfo" style="color: var(--muted);"></small>
      </div>
      <button class="btn-secondary" onclick="handleLogout()">Logout</button>
    </header>

    <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
      <button onclick="openUserModal('create')">+ Register User</button>
      <button class="btn-secondary" onclick="loadUserData()">Refresh Data</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="userTableBody">
        <tr><td colspan="5" style="text-align: center;">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 3. USER EDIT / REGISTER MODAL -->
  <div class="modal" id="userModal">
    <div class="modal-card">
      <h3 id="modalTitle" style="margin-bottom: 1rem;">User Details</h3>
      <form onsubmit="handleUserSubmit(event)">
        <input type="hidden" id="userId" />
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group" id="passwordGroup">
          <label>Password</label>
          <input type="password" id="password" />
        </div>
        <div class="form-group" id="roleGroup">
          <label>Role</label>
          <select id="role">
            <option value="user">User</option>
            <option value="manager">Manager</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
          <button type="button" class="btn-secondary" onclick="closeModal('userModal')">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 4. PASSWORD CHANGE MODAL -->
  <div class="modal" id="passwordModal">
    <div class="modal-card">
      <h3 style="margin-bottom: 1rem;">Update Password</h3>
      <form onsubmit="handlePasswordSubmit(event)">
        <input type="hidden" id="passUserId" />
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="newPassword" required minlength="6" />
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
          <button type="button" class="btn-secondary" onclick="closeModal('passwordModal')">Cancel</button>
          <button type="submit">Update</button>
        </div>
      </form>
    </div>
  </div>

<script>
  const API_HOST = 'http://localhost:8080';
  let isEditMode = false;

  document.addEventListener('DOMContentLoaded', initAuth);

  // --- Auth & State Helpers ---
  function parseJwt(token) {
    try {
      return JSON.parse(atob(token.split('.')[1]));
    } catch (e) {
      return null;
    }
  }

  function getHeaders() {
    return {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${localStorage.getItem('jwt_token')}`
    };
  }

  function initAuth() {
    const token = localStorage.getItem('jwt_token');
    const claims = parseJwt(token);

    if (claims) {
      document.getElementById('userSessionInfo').innerText = `Role: ${claims.role} | ID: ${claims.user_id}`;
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      loadUserData();
    } else {
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('dashboardView').classList.add('hidden');
    }
  }

  // --- Data Loading Logic ---
  async function loadUserData() {
    const claims = parseJwt(localStorage.getItem('jwt_token'));
    if (!claims) return;

    try {
      // Admin sees ALL users, regular User sees ONLY themselves
      const endpoint = claims.role === 'admin' ? '/api/users' : `/api/users/${claims.user_id}`;
      const res = await fetch(`${API_HOST}${endpoint}`, { headers: getHeaders() });
      if (!res.ok) throw await res.json();
      
      const data = await res.json();
      renderTable(Array.isArray(data) ? data : [data]);
    } catch (err) {
      alert(`Error loading data: ${err.error || 'Unauthorized'}`);
    }
  }

  function renderTable(users) {
    const claims = parseJwt(localStorage.getItem('jwt_token'));
    const tbody = document.getElementById('userTableBody');

    tbody.innerHTML = users.map(u => {
      const canEdit = claims.role === 'admin' || claims.user_id === u.id;
      const isAdmin = claims.role === 'admin';

      return `
        <tr>
          <td>${u.id}</td>
          <td>${u.username}</td>
          <td>${u.email}</td>
          <td>${u.role}</td>
          <td style="display: flex; gap: 0.3rem;">
            ${canEdit ? `
              <button onclick="editUser(${u.id}, '${u.username}', '${u.email}', '${u.role}')">Edit</button>
              <button class="btn-secondary" onclick="openPassModal(${u.id})">Password</button>
            ` : '<span style="color:var(--muted); font-size:0.8rem;">Read Only</span>'}
            ${isAdmin ? `<button class="btn-danger" onclick="deleteUser(${u.id})">Delete</button>` : ''}
          </td>
        </tr>
      `;
    }).join('');
  }

  // --- Action Handlers ---
  async function handleLogin(e) {
    e.preventDefault();
    try {
      const res = await fetch(`${API_HOST}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');

      localStorage.setItem('jwt_token', data.token);
      initAuth();
    } catch (err) {
      alert(err.message);
    }
  }

  function handleLogout() {
    localStorage.removeItem('jwt_token');
    initAuth();
  }

  // --- Modal Helpers & Actions ---
  function openModal(id) { document.getElementById(id).style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  function openUserModal(mode) {
    isEditMode = mode === 'edit';
    const claims = parseJwt(localStorage.getItem('jwt_token'));
    
    document.getElementById('modalTitle').innerText = isEditMode ? 'Edit Profile' : 'Register User';
    document.getElementById('passwordGroup').style.display = isEditMode ? 'none' : 'block';
    document.getElementById('roleGroup').style.display = claims?.role === 'admin' ? 'block' : 'none';
    openModal('userModal');
  }

  function editUser(id, username, email, role) {
    document.getElementById('userId').value = id;
    document.getElementById('username').value = username;
    document.getElementById('email').value = email;
    document.getElementById('role').value = role;
    openUserModal('edit');
  }

  async function handleUserSubmit(e) {
    e.preventDefault();
    const id = document.getElementById('userId').value;
    const endpoint = isEditMode ? `${API_HOST}/api/users/${id}` : `${API_HOST}/api/users/register`;
    const method = isEditMode ? 'PUT' : 'POST';

    const payload = {
      username: document.getElementById('username').value,
      email: document.getElementById('email').value,
      role: document.getElementById('role').value
    };
    if (!isEditMode) payload.password = document.getElementById('password').value;

    try {
      const res = await fetch(endpoint, { method, headers: getHeaders(), body: JSON.stringify(payload) });
      if (!res.ok) throw await res.json();

      closeModal('userModal');
      loadUserData();
    } catch (err) {
      alert(`Error: ${err.error || 'Failed'}`);
    }
  }

  function openPassModal(id) {
    document.getElementById('passUserId').value = id;
    openModal('passwordModal');
  }

  async function handlePasswordSubmit(e) {
    e.preventDefault();
    const id = document.getElementById('passUserId').value;
    const newPassword = document.getElementById('newPassword').value;

    try {
      const res = await fetch(`${API_HOST}/api/users/${id}/password`, {
        method: 'PATCH',
        headers: getHeaders(),
        body: JSON.stringify({ new_password: newPassword })
      });
      if (!res.ok) throw await res.json();

      alert('Password updated successfully!');
      closeModal('passwordModal');
    } catch (err) {
      alert(`Error: ${err.error || 'Failed'}`);
    }
  }

  async function deleteUser(id) {
    if (!confirm('Are you sure you want to delete this user?')) return;
    try {
      const res = await fetch(`${API_HOST}/api/users/${id}`, { method: 'DELETE', headers: getHeaders() });
      if (!res.ok) throw await res.json();
      loadUserData();
    } catch (err) {
      alert(`Error: ${err.error || 'Failed'}`);
    }
  }
</script>
</body>
</html>
