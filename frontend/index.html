<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - User Management</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem; }
    .container { max-width: 1100px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 600; }

    .token-bar { display: flex; gap: 0.5rem; background: var(--card); padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 1.5rem; }
    .token-bar input { flex: 1; background: transparent; border: none; color: var(--text); font-family: monospace; outline: none; }

    .actions { display: flex; gap: 1rem; margin-bottom: 1rem; }
    button { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 500; }
    button:hover { opacity: 0.9; }
    button.btn-danger { background: var(--danger); }
    button.btn-secondary { background: var(--border); }

    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    th, td { text-align: left; padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); }
    th { background: #162032; color: var(--muted); font-size: 0.85rem; text-transform: uppercase; }

    .badge { padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .badge-admin { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .badge-manager { background: rgba(245, 158, 11, 0.2); color: #fde047; }
    .badge-user { background: rgba(34, 197, 94, 0.2); color: #86efac; }

    /* Modal Styling */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; }
    .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 8px; width: 400px; padding: 1.5rem; }
    .modal-content h3 { margin-bottom: 1rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.3rem; }
    .form-group input, .form-group select { width: 100%; padding: 0.6rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>User Management Dashboard</h1>
  </header>

  <!-- JWT Bearer Token Input -->
  <div class="token-bar">
    <span style="color: var(--muted);">JWT:</span>
    <input type="password" id="jwtToken" placeholder="Paste Bearer Token here..." onchange="saveToken()" />
    <button onclick="saveToken()">Save Token</button>
  </div>

  <div class="actions">
    <button onclick="openModal('register')">+ Add User</button>
    <button class="btn-secondary" onclick="lookupUser()">Lookup User by ID</button>
  </div>

  <!-- User Table -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Created At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="userTableBody">
      <tr>
        <td colspan="6" style="text-align:center; color: var(--muted);">Enter a valid ID via "Lookup User by ID" or register a new user.</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Add/Edit User Modal -->
<div class="modal" id="userModal">
  <div class="modal-content">
    <h3 id="modalTitle">Register User</h3>
    <form id="userForm" onsubmit="handleFormSubmit(event)">
      <input type="hidden" id="userId" />
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group" id="passwordGroup">
        <label>Password</label>
        <input type="password" id="password" />
      </div>
      <div class="form-group">
        <label>Role</label>
        <select id="role">
          <option value="user">User</option>
          <option value="manager">Manager</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
        <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
  const API_BASE = 'http://localhost:8080/api/users';
  let isEditMode = false;

  // Load saved token from LocalStorage
  document.getElementById('jwtToken').value = localStorage.getItem('token') || '';

  function saveToken() {
    const token = document.getElementById('jwtToken').value;
    localStorage.setItem('token', token);
    alert('Token saved!');
  }

  function getHeaders() {
    const token = localStorage.getItem('token');
    return {
      'Content-Type': 'application/json',
      'Authorization': token ? `Bearer ${token}` : ''
    };
  }

  async function lookupUser() {
    const id = prompt('Enter User ID to fetch:');
    if (!id) return;

    try {
      const res = await fetch(`${API_BASE}/${id}`, { headers: getHeaders() });
      if (!res.ok) throw await res.json();
      const user = await res.json();
      renderUsers([user]);
    } catch (err) {
      alert(`Error: ${err.error || 'User not found or access denied'}`);
    }
  }

  function renderUsers(users) {
    const tbody = document.getElementById('userTableBody');
    tbody.innerHTML = users.map(u => `
      <tr>
        <td>${u.id}</td>
        <td>${u.username}</td>
        <td>${u.email}</td>
        <td><span class="badge badge-${u.role}">${u.role}</span></td>
        <td>${new Date(u.created_at).toLocaleString()}</td>
        <td>
          <button onclick="editUser(${u.id}, '${u.username}', '${u.email}', '${u.role}')">Edit</button>
          <button class="btn-danger" onclick="deleteUser(${u.id})">Delete</button>
        </td>
      </tr>
    `).join('');
  }

  function openModal(mode) {
    isEditMode = mode === 'edit';
    document.getElementById('modalTitle').innerText = isEditMode ? 'Edit User Profile' : 'Register User';
    document.getElementById('passwordGroup').style.display = isEditMode ? 'none' : 'block';
    document.getElementById('userModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('userModal').style.display = 'none';
    document.getElementById('userForm').reset();
  }

  function editUser(id, username, email, role) {
    document.getElementById('userId').value = id;
    document.getElementById('username').value = username;
    document.getElementById('email').value = email;
    document.getElementById('role').value = role;
    openModal('edit');
  }

  async function handleFormSubmit(e) {
    e.preventDefault();
    const id = document.getElementById('userId').value;
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const role = document.getElementById('role').value;
    const password = document.getElementById('password').value;

    const endpoint = isEditMode ? `${API_BASE}/${id}` : `${API_BASE}/register`;
    const method = isEditMode ? 'PUT' : 'POST';
    const payload = isEditMode ? { username, email, role } : { username, email, password, role };

    try {
      const res = await fetch(endpoint, {
        method,
        headers: getHeaders(),
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw await res.json();
      const updatedUser = await res.json();
      
      alert(isEditMode ? 'User updated successfully!' : 'User created successfully!');
      renderUsers([updatedUser]);
      closeModal();
    } catch (err) {
      alert(`Error: ${err.error || 'Failed to submit operation'}`);
    }
  }

  async function deleteUser(id) {
    if (!confirm(`Are you sure you want to delete user ID ${id}?`)) return;

    try {
      const res = await fetch(`${API_BASE}/${id}`, {
        method: 'DELETE',
        headers: getHeaders()
      });

      if (!res.ok) throw await res.json();
      alert('User deleted successfully');
      document.getElementById('userTableBody').innerHTML = `
        <tr><td colspan="6" style="text-align:center; color: var(--muted);">User deleted. Perform another lookup or add a new user.</td></tr>
      `;
    } catch (err) {
      alert(`Error: ${err.error || 'Failed to delete user'}`);
    }
  }
</script>
</body>
</html>
