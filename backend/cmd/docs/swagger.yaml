definitions:
  auditlog.AuditLog:
    properties:
      created_at:
        example: "2026-09-21T14:48:32Z"
        type: string
      event:
        example: document.download
        type: string
      event_happened_time:
        example: "2026-09-21T14:48:32Z"
        type: string
      id:
        example: 42
        type: integer
      ip_address:
        example: 203.0.113.10
        type: string
      success:
        example: true
        type: boolean
      user_agent:
        example: Mozilla/5.0
        type: string
      user_id:
        example: 1
        type: integer
      user_name:
        example: admin
        type: string
    type: object
  auditlog.AuditLogPage:
    properties:
      data:
        items:
          $ref: '#/definitions/auditlog.AuditLog'
        type: array
      limit:
        example: 50
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 128
        type: integer
    type: object
  auth.AuthUser:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
  auth.ErrorResponse:
    properties:
      error:
        example: invalid request
        type: string
      message:
        example: invalid email or password
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: admin@example.com
        type: string
      password:
        example: secret123
        type: string
    type: object
  auth.LoginResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1...
        type: string
      user:
        $ref: '#/definitions/auth.AuthUser'
    type: object
  document.Document:
    properties:
      comment:
        type: string
      description:
        type: string
      folder_id:
        type: integer
      id:
        type: integer
      mime_type:
        type: string
      name:
        type: string
      public_id:
        description: |-
          Cloudinary public_id — stored in the `file_path` DB column
          (kept the old column name to avoid a migration).
        type: string
      size:
        type: integer
      status:
        type: string
      uploaded_at:
        type: string
      user_id:
        type: integer
      version:
        type: integer
    type: object
  document.DocumentVersionResponse:
    properties:
      created_at:
        example: "2026-09-21T14:48:32Z"
        type: string
      hashed_string:
        example: a1b2c3...
        type: string
      id:
        example: 2f0c8e5b-...
        type: string
      is_current:
        example: true
        type: boolean
      original_filename:
        example: Contract-2026.pdf
        type: string
      preview_url:
        example: https://res.cloudinary.com/...
        type: string
      url:
        example: https://res.cloudinary.com/...
        type: string
      version:
        example: 3
        type: integer
    type: object
  document.MessageResponse:
    properties:
      message:
        example: Document deleted
        type: string
    type: object
  document.MoveDocumentRequest:
    properties:
      folder_id:
        example: 3
        type: integer
    type: object
  document.RenameDocumentRequest:
    properties:
      name:
        example: Contract-2026.pdf
        type: string
    type: object
  document.UpdateStatusRequest:
    properties:
      comment:
        example: Looks good
        type: string
      status:
        enum:
        - approved
        - rejected
        example: approved
        type: string
    type: object
  document.UploadResponse:
    properties:
      document: {}
      message:
        example: File uploaded successfully
        type: string
    type: object
  document.VersionDownloadResponse:
    properties:
      filename:
        example: Contract-2026.pdf
        type: string
      url:
        example: https://res.cloudinary.com/...
        type: string
    type: object
  documentversion.VersionDownloadResponse:
    properties:
      filename:
        example: Contract-2026.pdf
        type: string
      url:
        example: https://res.cloudinary.com/...
        type: string
    type: object
  documentversion.VersionMessageResponse:
    properties:
      message:
        example: Version deleted
        type: string
    type: object
  documentversion.VersionResponse:
    properties:
      created_at:
        example: "2026-09-21T14:48:32Z"
        type: string
      document_id:
        example: 12
        type: integer
      hashed_string:
        example: a1b2c3...
        type: string
      id:
        example: 2f0c8e5b-...
        type: string
      original_filename:
        example: Contract-2026.pdf
        type: string
      preview_url:
        example: https://res.cloudinary.com/...
        type: string
      url:
        example: https://res.cloudinary.com/...
        type: string
      user_id:
        example: 3
        type: integer
      version:
        example: 4
        type: integer
    type: object
  documentversion.VersionRestoreResponse:
    properties:
      message:
        example: Version restored
        type: string
      version:
        example: 4
        type: integer
    type: object
  folder.CreateFolderRequest:
    properties:
      name:
        example: Contracts
        type: string
    type: object
  folder.ErrorResponse:
    properties:
      error:
        example: Failed to delete folder
        type: string
    type: object
  folder.Folder:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  folder.MessageResponse:
    properties:
      message:
        example: Folder deleted
        type: string
    type: object
  folder.UpdateFolderRequest:
    properties:
      name:
        example: Contracts 2026
        type: string
    type: object
info:
  contact: {}
paths:
  /auditlogs:
    get:
      description: |-
        Returns a page of audit events. Only admins can call this endpoint.
        Supports filtering by user, event type, and time range.
      parameters:
      - description: Page size (default 50, max 500)
        in: query
        maximum: 500
        minimum: 1
        name: limit
        type: integer
      - description: Offset (default 0)
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      - description: Filter by event name (exact match)
        example: user.login
        in: query
        name: event
        type: string
      - description: Start time, RFC3339
        example: "2026-09-01T00:00:00Z"
        in: query
        name: from
        type: string
      - description: End time, RFC3339
        example: "2026-09-30T23:59:59Z"
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auditlog.AuditLogPage'
        "400":
          description: Invalid query parameter
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden — admin only
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - audit
  /auth/login:
    post:
      consumes:
      - application/json
      description: Validate credentials and return a JWT plus the user profile.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Invalid JSON body
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Log in
      tags:
      - auth
  /documents:
    get:
      description: Search by name or description, optionally limited to a folder.
      parameters:
      - description: Search term
        example: contract
        in: query
        name: search
        type: string
      - description: Limit to a folder
        in: query
        name: folder_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/document.Document'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search documents
      tags:
      - documents
  /documents/{id}:
    delete:
      description: Deletes the document and every version of it.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/document.MessageResponse'
        "400":
          description: Invalid document ID
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a document
      tags:
      - documents
    get:
      description: Redirects (302) to a Cloudinary URL with fl_attachment.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "302":
          description: Redirect to the Cloudinary download URL
        "400":
          description: Invalid document ID
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Failed to generate URL
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download the latest version
      tags:
      - documents
    patch:
      consumes:
      - application/json
      description: Updates the display name. File content is unchanged.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      - description: New name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/document.RenameDocumentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/document.MessageResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rename a document
      tags:
      - documents
  /documents/{id}/content:
    put:
      consumes:
      - multipart/form-data
      description: Creates a new version of the document (v2, v3, ...).
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      - description: New file content
        in: formData
        name: document
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/document.MessageResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload a new version
      tags:
      - documents
  /documents/{id}/move:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      - description: Target folder
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/document.MoveDocumentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/document.MessageResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Move a document to another folder
      tags:
      - documents
  /documents/{id}/status:
    patch:
      consumes:
      - application/json
      description: Only managers and admins can call this. Comment is optional.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      - description: Decision + comment
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/document.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/document.MessageResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve or reject a document
      tags:
      - documents
  /documents/{id}/versions:
    get:
      description: Returns all versions newest first, each with fresh Cloudinary URLs.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/documentversion.VersionResponse'
            type: array
        "400":
          description: Invalid document ID
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List versions of a document
      tags:
      - document-versions
  /folders:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/folder.Folder'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/folder.ErrorResponse'
        "500":
          description: Failed to retrieve folders
          schema:
            $ref: '#/definitions/folder.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List folders
      tags:
      - folders
    post:
      consumes:
      - application/json
      description: Creates a folder owned by the authenticated user.
      parameters:
      - description: Folder payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/folder.CreateFolderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/folder.Folder'
        "400":
          description: Invalid payload
          schema:
            $ref: '#/definitions/folder.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/folder.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a folder
      tags:
      - folders
  /folders/{folderId}/documents:
    get:
      parameters:
      - description: Folder ID
        in: path
        name: folderId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/document.Document'
            type: array
        "400":
          description: Invalid folder ID
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List documents in a folder
      tags:
      - documents
    post:
      consumes:
      - multipart/form-data
      description: Uploads a new file into the given folder and creates version 1.
      parameters:
      - description: Folder ID
        in: path
        name: folderId
        required: true
        type: integer
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      - description: Optional description
        in: formData
        name: description
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/document.UploadResponse'
        "400":
          description: Invalid folder ID or missing file
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload a document
      tags:
      - documents
  /folders/{id}:
    delete:
      description: Deletes the folder and every document it contains.
      parameters:
      - description: Folder ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/folder.MessageResponse'
        "400":
          description: Invalid folder ID
          schema:
            $ref: '#/definitions/folder.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/folder.ErrorResponse'
        "500":
          description: Failed to delete folder
          schema:
            $ref: '#/definitions/folder.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a folder
      tags:
      - folders
    put:
      consumes:
      - application/json
      parameters:
      - description: Folder ID
        in: path
        name: id
        required: true
        type: integer
      - description: New name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/folder.UpdateFolderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/folder.Folder'
        "400":
          description: Invalid folder ID or payload
          schema:
            $ref: '#/definitions/folder.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/folder.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/folder.ErrorResponse'
        "404":
          description: Folder not found
          schema:
            $ref: '#/definitions/folder.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rename a folder
      tags:
      - folders
  /versions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/documentversion.VersionResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden — admin only
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all versions (admin only)
      tags:
      - document-versions
  /versions/{id}:
    delete:
      parameters:
      - description: Version UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/documentversion.VersionMessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden — admin only
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a version (admin only)
      tags:
      - document-versions
    get:
      parameters:
      - description: Version UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/documentversion.VersionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Version not found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a version
      tags:
      - document-versions
  /versions/{id}/download:
    get:
      description: Returns JSON with url + filename. The frontend triggers the download.
      parameters:
      - description: Version UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/documentversion.VersionDownloadResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Version not found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download a version
      tags:
      - document-versions
  /versions/{id}/restore:
    post:
      description: Makes the given version the current one.
      parameters:
      - description: Version UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/documentversion.VersionRestoreResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Version not found
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restore an old version
      tags:
      - document-versions
swagger: "2.0"
